workflows:
  saha-disi-ios:
    name: Saha Dışı iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: nova

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sahadisi.app
      xcode: latest

    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Set unique build number
        script: |
          cd ios/SahaDisi
          BUILD_NUMBER=$(date -u +%y%m%d%H%M)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Info.plist
          echo "Using build number $BUILD_NUMBER"

      - name: Build IPA
        script: |
          cd ios/SahaDisi
          xcode-project build-ipa \
            --project "SahaDisi.xcodeproj" \
            --scheme "SahaDisi"

      - name: Verify IPA exists
        script: |
          IPA_COUNT=$(find ios/SahaDisi/build/ios/ipa -name '*.ipa' -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "IPA files found: $IPA_COUNT"
          if [ "$IPA_COUNT" -lt 1 ]; then
            echo "No IPA produced; stopping before publishing."
            exit 1
          fi
          find ios/SahaDisi/build/ios/ipa -name '*.ipa' -type f -print

    artifacts:
      - ios/SahaDisi/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
