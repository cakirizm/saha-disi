workflows:
  saha-disi-ios:
    name: Saha Dışı iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: saha_disi_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sahadisi.app
      xcode: latest
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.sahadisi.app" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build archive
        script: |
          cd ios/SahaDisi
          xcode-project build-ipa \
            --project "SahaDisi.xcodeproj" \
            --scheme "SahaDisi"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
