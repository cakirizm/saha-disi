workflows:
  saha-disi-ios:
    name: Saha Dışı iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # App Store Connect API key + certificate private key come from the
      # "appstore" variable group (defined in Codemagic → Environment variables).
      groups:
        - appstore
      # No automatic ios_signing block: it fetches (but never creates) the
      # profile during environment setup and fails before the scripts run.
      # Signing files are created explicitly in the "Set up code signing" step.
      xcode: latest

    scripts:
      - name: Set up code signing
        script: |
          set -e
          # Confirm the signing credentials actually reached the build (no secrets printed).
          echo "ISSUER_ID set:   ${APP_STORE_CONNECT_ISSUER_ID:+yes}"
          echo "KEY_ID set:      ${APP_STORE_CONNECT_KEY_IDENTIFIER:+yes}"
          echo "API_KEY set:     ${APP_STORE_CONNECT_PRIVATE_KEY:+yes}"
          echo "CERT_KEY set:    ${CERTIFICATE_PRIVATE_KEY:+yes}"
          keychain initialize
          # Create the App Store distribution certificate + provisioning profile
          # if they do not exist yet. --verbose surfaces exactly what happens.
          app-store-connect fetch-signing-files "com.sahadisi.app" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create \
            --verbose
          echo "== profiles created on disk =="
          find "$HOME/Library/MobileDevice/Provisioning Profiles" \
               "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
               -name '*.mobileprovision' 2>/dev/null || true
          keychain add-certificates
          xcode-project use-profiles

      - name: Generate Saha Dışı app icon
        script: |
          python3 scripts/generate_app_icon.py
          file ios/SahaDisi/SahaDisi/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Set unique build number
        script: |
          cd ios/SahaDisi
          BUILD_NUMBER=$(date -u +%y%m%d%H%M)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Info.plist
          echo "Using build number $BUILD_NUMBER"

      - name: Bundle latest verified feed
        script: |
          cp backend/feed.json ios/SahaDisi/SahaDisi/Resources/seed.json
          python3 -c "import json; json.load(open('ios/SahaDisi/SahaDisi/Resources/seed.json', encoding='utf-8'))"

      - name: Build IPA
        script: |
          cd ios/SahaDisi
          # The minimal Xcode project isn't patched by use-profiles, so pass the
          # signing team, identity and the freshly created App Store profile
          # explicitly as archive build settings (these override the project).
          # Xcode 16+ moved the profiles dir, so search both known locations.
          echo "== provisioning profile dirs =="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || true
          ls -la "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/" 2>/dev/null || true
          PROFILE=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" \
                         "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                         -name '*.mobileprovision' 2>/dev/null | head -n 1)
          PROFILE_NAME=$(security cms -D -i "$PROFILE" 2>/dev/null | plutil -extract Name raw - 2>/dev/null)
          echo "Signing with profile: $PROFILE_NAME"
          if [ -z "$PROFILE_NAME" ]; then
            echo "No provisioning profile found on disk — fetch-signing-files did not create one."
            exit 1
          fi
          xcode-project build-ipa \
            --project "SahaDisi.xcodeproj" \
            --scheme "SahaDisi" \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=34JL83RV94 CODE_SIGN_IDENTITY=\"Apple Distribution\" PROVISIONING_PROFILE_SPECIFIER=\"$PROFILE_NAME\""

      - name: Verify IPA exists
        script: |
          IPA_COUNT=$(find ios/SahaDisi/build/ios/ipa -name '*.ipa' -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "IPA files found: $IPA_COUNT"
          if [ "$IPA_COUNT" -lt 1 ]; then
            echo "No IPA produced; stopping before publishing."
            exit 1
          fi
          find ios/SahaDisi/build/ios/ipa -name '*.ipa' -type f -print

    artifacts:
      - ios/SahaDisi/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
