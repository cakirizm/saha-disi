name: Saha Disi Live Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'backend/*.py'
      - 'backend/sources.json'
      - 'backend/commentators.json'
      - 'backend/commentator_roster.json'
      - 'backend/fixture_overrides.json'
      - 'backend/manual_verified.json'
      - 'backend/team_logos.json'
      - '.github/workflows/collector.yml'

permissions:
  contents: write

concurrency:
  group: saha-disi-live-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Collect public commentary
        run: python backend/collector_v3.py

      - name: Collect official TFF fixture
        run: python backend/tff_fixtures.py || echo 'TFF parser unavailable; keeping previous fixture data.'

      - name: Resolve public commentator photos
        run: python backend/photo_resolver.py || echo 'Photo resolver unavailable; initials remain as fallback.'

      - name: Resolve public team logos
        run: python backend/team_logo_resolver.py || echo 'Team logo resolver unavailable; initials remain as fallback.'

      - name: Build live feed
        run: python backend/build_feed.py

      - name: Validate feed before publish
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          feed=json.loads(Path('backend/feed.json').read_text())
          roster=json.loads(Path('backend/commentator_roster.json').read_text())
          overrides=json.loads(Path('backend/fixture_overrides.json').read_text())

          commentators=feed.get('commentators', [])
          statements=feed.get('statements', [])
          matches=feed.get('matches', [])

          assert len(commentators) == len(roster) == 204, 'commentator roster mismatch'
          assert isinstance(statements, list) and isinstance(matches, list)
          assert feed.get('generated_at'), 'generated_at missing'

          statement_ids=[s['id'] for s in statements]
          assert len(statement_ids)==len(set(statement_ids)), 'duplicate statement ids'
          valid_commentators={c['id'] for c in commentators}
          assert all(s.get('commentator') in valid_commentators for s in statements), 'unknown commentator in statement'

          # Never publish editorial summaries as if they were quotations.
          assert all(s.get('verbatim') is True for s in statements), 'non-verbatim statement reached live feed'
          assert all(s.get('status') in {'verified_manual','verified_direct_quote'} for s in statements), 'unverified statement reached live feed'
          assert all(len((s.get('summary') or '').strip()) >= 20 for s in statements), 'empty/short statement reached live feed'

          match_ids=[m.get('id') for m in matches]
          assert all(match_ids) and len(match_ids)==len(set(match_ids)), 'missing/duplicate match ids'
          assert all(int(m.get('week',0)) > 0 for m in matches), 'invalid match week'

          # Every hand-verified current fixture must survive the automated merge exactly.
          by_id={m['id']:m for m in matches}
          for expected in overrides:
              actual=by_id.get(expected['id'])
              assert actual is not None, f"verified fixture missing: {expected['id']}"
              for key in ('league','week','home','away','kickoff','home_score','away_score'):
                  assert actual.get(key)==expected.get(key), f"fixture mismatch {expected['id']} field={key}: {actual.get(key)!r} != {expected.get(key)!r}"
              datetime.fromisoformat(expected['kickoff'])
              assert actual.get('home_logo_url'), f"home logo missing: {expected['home']}"
              assert actual.get('away_logo_url'), f"away logo missing: {expected['away']}"

          print('validated', len(commentators), 'commentators', len(statements), 'verified statements', len(matches), 'matches', len(overrides), 'verified fixtures')
          PY

      - name: Publish changed live data
        run: |
          git config user.name 'saha-disi-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/feed.json backend/collector_health.json backend/review_queue.json backend/candidates.json
          test ! -f backend/tff_matches.json || git add backend/tff_matches.json
          test ! -f backend/commentator_photos.json || git add backend/commentator_photos.json
          test ! -f backend/team_logos.json || git add backend/team_logos.json
          if git diff --cached --quiet; then
            echo 'No feed changes.'
          else
            git commit -m 'data: refresh live football commentary feed'
            git pull --rebase origin main
            git push origin main
          fi
