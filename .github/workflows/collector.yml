name: Saha Disi Collector
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public sources
        run: |
          python backend/collector_v3.py
          python backend/build_feed.py
      - name: Commit feed if changed
        run: |
          git config user.name 'saha-disi-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/feed.json backend/review_queue.json backend/candidates.json backend/collector_health.json || true
          git diff --cached --quiet || git commit -m 'data: refresh Saha Disi feed'
          git push
