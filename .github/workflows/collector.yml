name: Saha Disi Live Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'backend/*.py'
      - 'backend/sources.json'
      - 'backend/commentators.json'
      - 'backend/commentator_roster.json'
      - '.github/workflows/collector.yml'

permissions:
  contents: write

concurrency:
  group: saha-disi-live-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Collect public commentary
        run: python backend/collector_v3.py

      - name: Collect official TFF fixture
        run: python backend/tff_fixtures.py || echo 'TFF parser unavailable; keeping previous fixture data.'

      - name: Resolve public commentator photos
        run: python backend/photo_resolver.py || echo 'Photo resolver unavailable; initials remain as fallback.'

      - name: Build live feed
        run: python backend/build_feed.py

      - name: Validate feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('backend/feed.json').read_text())
          roster=json.loads(Path('backend/commentator_roster.json').read_text())
          assert len(p.get('commentators', [])) == len(roster) == 204
          assert isinstance(p.get('statements'), list)
          assert isinstance(p.get('matches'), list)
          assert p.get('generated_at')
          ids=[s['id'] for s in p['statements']]
          assert len(ids)==len(set(ids))
          valid={c['id'] for c in p['commentators']}
          assert all(s['commentator'] in valid for s in p['statements'])
          assert all(int(m.get('week',0)) > 0 for m in p['matches'])
          print('validated', len(p['commentators']), 'commentators', len(p['statements']), 'statements', len(p['matches']), 'matches')
          PY

      - name: Publish changed live data
        run: |
          git config user.name 'saha-disi-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/feed.json backend/collector_health.json backend/review_queue.json backend/candidates.json
          test ! -f backend/tff_matches.json || git add backend/tff_matches.json
          test ! -f backend/commentator_photos.json || git add backend/commentator_photos.json
          if git diff --cached --quiet; then
            echo 'No feed changes.'
          else
            git commit -m 'data: refresh live football commentary feed'
            git pull --rebase origin main
            git push origin main
          fi
