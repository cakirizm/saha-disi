name: Saha Disi Live Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'backend/*.py'
      - 'backend/sources.json'
      - 'backend/social_accounts.json'
      - 'tests/**'
      - 'backend/commentator_roster.json'
      - 'backend/manual_verified.json'
      - 'backend/fixture_overrides.json'
      - 'ios/SahaDisi/SahaDisi/**/*.swift'
      - '.github/workflows/collector.yml'

permissions:
  contents: write

concurrency:
  # Shared with the final-audit workflow so the two never publish at the same
  # time and race each other's push. Queue instead of cancelling.
  group: saha-disi-publish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install collector dependencies
        run: pip install -r backend/requirements.txt

      - name: Run data regression tests
        run: python -m unittest discover -s tests -v
      - name: Collect incremental multi-source commentary
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
        run: python backend/collector_v4.py

      - name: Collect official TFF fixture
        run: python backend/tff_fixtures.py

      - name: Resolve verified commentator photos
        run: python backend/photo_resolver.py

      - name: Resolve real club crests
        run: python backend/team_logo_resolver.py

      - name: Resolve free-licensed player photos
        run: python backend/player_photo_resolver.py

      - name: Build live feed
        run: python backend/build_feed.py

      - name: Validate feed integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('backend/feed.json').read_text())
          roster=json.loads(Path('backend/commentator_roster.json').read_text())
          logos=json.loads(Path('backend/team_logos.json').read_text())
          photos=json.loads(Path('backend/commentator_photos.json').read_text()).get('photos',{})
          assert len(p.get('commentators', [])) == len(roster)
          assert isinstance(p.get('statements'), list) and isinstance(p.get('matches'), list)
          assert p.get('generated_at')
          ids=[s['id'] for s in p['statements']]
          assert len(ids)==len(set(ids))
          valid={c['id'] for c in p['commentators']}
          assert all(s['commentator'] in valid for s in p['statements'])
          assert all(s.get('verbatim') is True for s in p['statements'])
          assert all(s.get('status') in {'verified_manual','verified_direct_quote'} for s in p['statements'])
          editorial=(' eleştirdi',' yorumladı',' değerlendirdi',' söyledi',' sert dille',' açıkladı')
          assert not any(any(x in (' '+s.get('summary','').casefold()) for x in editorial) for s in p['statements'])
          bad=('Ã','Å','Ä','Â','�')
          def walk(v):
            if isinstance(v,str): return [v]
            if isinstance(v,list): return [x for i in v for x in walk(i)]
            if isinstance(v,dict): return [x for i in v.values() for x in walk(i)]
            return []
          broken=[s for s in walk(p) if any(x in s for x in bad)]
          assert not broken, f'mojibake detected: {broken[:5]}'
          assert len(p['matches']) >= 18
          assert all(int(m.get('week',0)) > 0 for m in p['matches'])
          current=[m for m in p['matches'] if int(m.get('week',0))==4]
          assert len(current)==9, f'week 4 fixture count {len(current)} != 9'
          teams={m['home'] for m in p['matches']}|{m['away'] for m in p['matches']}
          missing=[t for t in teams if not logos.get(t)]
          assert not missing, f'missing logos: {missing}'
          assert not [u for u in logos.values() if 'google.com/s2/favicons' in u]
          assert all((not c.get('photoURL')) or c['id'] in photos for c in p['commentators'])
          print('PASS feed',len(p['commentators']),'commentators',len(p['statements']),'literal quotes',len(p['matches']),'matches',len(photos),'verified photos')
          PY

      - name: Validate iOS source requirements
        run: |
          python - <<'PY'
          from pathlib import Path
          joined='\n'.join(p.read_text() for p in Path('ios/SahaDisi/SahaDisi').rglob('*.swift'))
          assert 'Birinci Hafta' in joined and 'Üçüncü Hafta' in joined and 'Dördüncü Hafta' in joined
          assert 'func statements(for commentatorID: String, team: String)' in joined
          assert 'NotificationSettingsView' in joined
          assert 'toggle(commentatorID:' in joined
          assert 'MatchPoster' in joined
          assert 'Takımlar Hakkındaki Güncel Yorumlar' in joined
          print('PASS iOS static requirements')
          PY

      - name: Publish changed live data
        run: |
          git config user.name 'saha-disi-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/feed.json backend/collector_health.json backend/review_queue.json backend/candidates.json backend/collector_state.json
          git add backend/source_publications.json backend/quarantined_statements.json backend/fixture_health.json backend/tff_matches.json backend/commentator_photos.json backend/team_logos.json backend/player_photos.json
          if git diff --cached --quiet; then
            echo 'No feed changes.'
          else
            git commit -m 'data: refresh verified live feed'
            n=0
            while true; do
              git rebase --abort 2>/dev/null || true
              if git pull --rebase -X theirs --autostash origin main && git push origin main; then break; fi
              n=$((n+1)); if [ $n -ge 6 ]; then echo "publish failed after $n attempts"; exit 1; fi
              echo "push race, retry $n"; sleep 5
            done
          fi
